name: Daily Glycol Prices

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update glycol prices
        run: python update_prices.py

      - name: Save updated prices
        run: |
          git config user.name "glycol-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Daily glycol price update"
          git push
